services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: ${DB_NAME:-glescrocs}
      MYSQL_USER: ${DB_USER:-glescrocs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-glescrocs}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_SETUP_CODE: ${ADMIN_SETUP_CODE:?ADMIN_SETUP_CODE must be set in .env}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-glescrocs}
      DB_PASSWORD: ${DB_PASSWORD:-glescrocs}
      DB_NAME: ${DB_NAME:-glescrocs}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
