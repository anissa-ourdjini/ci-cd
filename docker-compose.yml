services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: glescrocs
      MYSQL_USER: glescrocs
      MYSQL_PASSWORD: glescrocs
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change_me}
      ADMIN_SETUP_CODE: ${ADMIN_SETUP_CODE:-change_me_admin}
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: glescrocs
      DB_PASSWORD: glescrocs
      DB_NAME: glescrocs
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  database_data:
