name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test build
        run: npm test

  backend:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  e2e:
    name: Test E2E Cypress
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npm install --no-save cypress@13.17.0 wait-on@8.0.1

      - name: Start frontend
        run: npm run dev -- --host 127.0.0.1 &

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:5173

      - name: Run Cypress
        run: npx cypress run

  docker:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e]
    env:
      JWT_SECRET: ci-only-secret
      ADMIN_SETUP_CODE: ci-only-admin-code
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image tags
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ci-cd-backend
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha

      - name: Frontend image tags
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ci-cd-frontend
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=production,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha

      - name: Validate Compose file
        run: docker compose config

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify Google Chat
    runs-on: ubuntu-latest
    needs: [frontend, backend, e2e, docker]
    if: ${{ always() }}
    env:
      CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
      CHAT_WEBHOOK: ${{ secrets.CHAT_WEBHOOK }}
      CHAT_WEBHOOK_LEGACY: ${{ secrets.chat_webhook }}
    steps:
      - name: Send pipeline result
        shell: bash
        run: |
          WEBHOOK="${CHAT_WEBHOOK_URL:-${CHAT_WEBHOOK:-$CHAT_WEBHOOK_LEGACY}}"
          if [ -z "$WEBHOOK" ]; then
            echo "Webhook not configured: add CHAT_WEBHOOK_URL or chat_webhook in GitHub Actions secrets."
            exit 0
          fi

          if [ "${{ needs.frontend.result }}" = "success" ] &&
             [ "${{ needs.backend.result }}" = "success" ] &&
             [ "${{ needs.e2e.result }}" = "success" ] &&
             [ "${{ needs.docker.result }}" = "success" ]; then
            STATUS="SUCCESS"
            REASON="All tests and Docker builds passed."
          else
            STATUS="FAILURE"
            REASON="A test or Docker step failed. Open the workflow logs for the exact error."
          fi

          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"text": "CI/CD " + os.environ["STATUS"] + "\nCommit: " + os.environ["COMMIT"] + "\nRef: " + os.environ["REF"] + "\nStatus: " + os.environ["STATUS"] + "\nReason: " + os.environ["REASON"] + "\nWorkflow: " + os.environ["RUN_URL"]}))')
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK"
        env:
          STATUS: ${{ (needs.frontend.result == 'success' && needs.backend.result == 'success' && needs.e2e.result == 'success' && needs.docker.result == 'success') && 'SUCCESS' || 'FAILURE' }}
          REASON: ${{ (needs.frontend.result == 'success' && needs.backend.result == 'success' && needs.e2e.result == 'success' && needs.docker.result == 'success') && 'All tests and Docker builds passed.' || 'A test or Docker step failed. Open the workflow logs for the exact error.' }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
